<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Stock Watchlist</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/css/app.css">
</head>

<body>

<!-- ================= LOGIN ================= -->
<div id="loginScreen" class="login-wrap">
  <div class="login-card">
    <h2 style="margin-bottom:6px">📈 Stock Watchlist</h2>
    <p style="opacity:.6;margin-bottom:18px">Track. Alert. Win.</p>

    <input id="email" placeholder="Email">
    <input id="password" type="password" placeholder="Password">

    <button id="loginBtn">Login</button>
    <button id="signupBtn" style="margin-top:8px;background:#020617;border:1px solid #1f2a44">
      Sign Up
    </button>
  </div>
</div>


<!-- ================= APP ================= -->
<div id="appScreen" style="display:none">

<header>
  <div>
    <strong>📈 Stock Watchlist</strong>
    <nav>
      <button id="tabWatch" class="active">Watchlist</button>
      <button id="tabAlerts">Alerts</button>
      <button id="tabIndices">Indices</button>
    </nav>
  </div>
  <button id="logoutBtn">Logout</button>
</header>


<div class="app-wrap">

  <!-- ================= WATCHLIST CONTROLS ================= -->
  <div class="watchlist-controls">

    <div class="watchlist-selector-group">
      <label>Watchlist</label>

      <select id="watchlistSelector"></select>
    </div>

    <div class="watchlist-actions">
      <button id="createWatchlistBtn" class="primary-btn">
        + New
      </button>

      <button id="deleteWatchlistBtn" class="danger-btn">
        Delete
      </button>
    </div>

  </div>


  <!-- ================= FILTER BAR ================= -->
  <div class="filter-bar">

    <div class="filter-group">
      <label>Industry</label>
      <select id="industryFilter">
        <option value="">All Industries</option>
      </select>
    </div>

    <div class="filter-group">
      <label>Category</label>
      <select id="categoryFilter">
        <option value="">All Categories</option>
      </select>
    </div>

    <button id="clearFilters" class="clear-btn">
      Clear
    </button>

    <div class="quick-filters">
      <button id="filterAll" class="qf-btn active">All</button>
      <button id="filterGainers" class="qf-btn">Gainers</button>
      <button id="filterLosers" class="qf-btn">Losers</button>
    </div>

  </div>


  <!-- ================= WATCHLIST TAB ================= -->
  <div id="watchTab">

    <div class="search-card">
      <input id="search" class="search-input" placeholder="Search stock...">
      <div id="dropdown" class="dropdown"></div>
    </div>

    <div class="table-wrap">
      <table class="watchlist-table">

        <thead>
          <tr>
            <th>Stock</th>
            <th>Price</th>
            <th>1D ₹</th>
            <th>1D %</th>
            <th>1W %</th>
            <th>1M %</th>
            <th>3M %</th>
            <th>52W High</th>
            <th>52W Low</th>
            <th></th>
          </tr>
        </thead>

        <tbody id="stockTableBody"></tbody>

      </table>
    </div>

  </div>


  <!-- ================= ALERTS TAB ================= -->
  <div id="alertsTab" style="display:none">

    <div class="alert-card">

      <h3>🔔 Price Alerts</h3>

      <div class="alert-form">
        <select id="alertSymbol"></select>

        <input id="alertPrice"
               type="number"
               placeholder="Target Price">

        <button id="addAlertBtn">
          Add Alert
        </button>
      </div>

      <div id="alertList" class="alert-list"></div>

    </div>

  </div>


  <!-- ================= INDICES TAB ================= -->
  <div id="indicesTab" style="display:none">

    <div class="alert-card">

      <h3>📊 Market Indices</h3>

      <div class="table-wrap">

        <table class="watchlist-table">

          <thead>
            <tr>
              <th>Index</th>
              <th>Price</th>
              <th>1D ₹</th>
              <th>1W %</th>
              <th>1M %</th>
              <th>3M %</th>
              <th>52W High</th>
              <th>52W Low</th>
            </tr>
          </thead>

          <tbody id="indicesTableBody"></tbody>

        </table>

      </div>

      <p style="opacity:.5;font-size:12px;margin-top:10px">
        Data auto-refreshes during market hours
      </p>

    </div>

  </div>


</div>
</div>


<script type="module" src="/js/app.js"></script>

</body>
</html>
